name: Security Audit

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # Segunda-feira 08:00 UTC — auditoria semanal
    - cron: "0 8 * * 1"

jobs:
  # ── Python: pip-audit (CVEs em dependências) ──────────────────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --strict

  # ── Python: Bandit (SAST) ─────────────────────────────────────────────────
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install "bandit[toml]==1.7.10"
      - name: Run Bandit
        run: |
          bandit -r backend/app \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r backend/app \
            --severity-level medium \
            --confidence-level medium
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Python: Testes de segurança ───────────────────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install "pytest==8.3.4" "pytest-asyncio==0.24.0" "httpx==0.27.2"
        working-directory: .
      - name: Run security tests
        run: pytest backend/tests/ -v --tb=short
        env:
          APP_ENV: test
          # Legacy env vars used only in CI — production uses systemd credentials
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long-for-ci
          JWT_ISSUER: openvas-dashboard-test
          JWT_AUDIENCE: openvas-dashboard-users-test
          APP_USERNAME: testuser
          APP_PASSWORD_HASH: "$argon2id$v=19$m=65536,t=3,p=4$c29tZXNhbHRzb21lc2FsdA$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          GVM_USERNAME: testgvm
          GVM_PASSWORD: testgvmpass
          GVM_SOCKET_PATH: "/tmp/fake-gvmd.sock"
          COOKIE_SECURE: "false"

  # ── Node/npm: audit ───────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        working-directory: frontend

  # ── TypeScript check ──────────────────────────────────────────────────────
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── CodeQL ────────────────────────────────────────────────────────────────
  # Análise CodeQL gerenciada pelo Default Setup do GitHub (Settings → Security).
  # Job removido para evitar conflito: "advanced configuration cannot be processed
  # when the default setup is enabled". O Default Setup cobre Python e JavaScript
  # e já aparece como CodeQL #N ✅ nas Actions.
