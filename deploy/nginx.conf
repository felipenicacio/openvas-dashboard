# nginx — OpenVAS Dashboard v1.1.0
# Redireciona HTTP → HTTPS (produção)
# Para HTTPS completo, use nginx-https.conf
#
# Instalação:
#   sudo cp nginx.conf /etc/nginx/sites-available/openvas-dashboard
#   sudo ln -sf /etc/nginx/sites-available/openvas-dashboard \
#                /etc/nginx/sites-enabled/openvas-dashboard
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name _;    # substitua pelo seu domínio/IP em produção

    # Redireciona todo tráfego HTTP para HTTPS
    # Em ambiente sem TLS (dev/lab), comentar e usar nginx-https.conf sem redirect
    return 301 https://$host$request_uri;
}
