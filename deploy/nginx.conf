server {
    listen 80;
    server_name _;

    root /var/www/ovdash;
    index index.html;

    # React Router SPA — todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy das chamadas /api → backend FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache de assets estáticos do frontend
    location ~* \.(js|css|png|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
