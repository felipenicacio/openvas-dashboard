# nginx HTTPS — OpenVAS Dashboard v1.1.0
# TLS 1.2 + 1.3, HSTS, security headers
#
# Pré-requisitos:
#   1. Certificado TLS em /etc/ssl/openvas-dashboard/ (cert.pem + key.pem)
#      Em dev: sudo openssl req -x509 -nodes -days 365 \
#              -newkey rsa:2048 -keyout key.pem -out cert.pem \
#              -subj "/CN=openvas-dashboard"
#   2. Ajuste server_name para seu domínio/IP
#
# Referência: Mozilla SSL Configuration Generator (Intermediate)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;    # substitua pelo seu domínio/IP

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/openvas-dashboard/cert.pem;
    ssl_certificate_key /etc/ssl/openvas-dashboard/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # ── HSTS ─────────────────────────────────────────────────────────────────
    # 6 meses — aumentar para 1 ano (31536000) após validar produção estável
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ── Security Headers ──────────────────────────────────────────────────────
    # Nota: CSP, X-Frame-Options, X-Content-Type-Options são adicionados pelo
    # SecurityHeadersMiddleware do FastAPI. Estes headers nginx são para o
    # frontend estático servido diretamente pelo nginx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/openvas-dashboard-access.log;
    error_log  /var/log/nginx/openvas-dashboard-error.log warn;

    # ── Frontend (React SPA — Vite build) ────────────────────────────────────
    root /opt/openvas-dashboard/frontend/dist;
    index index.html;

    # Assets com cache longo (Vite usa hash no filename)
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — todas as rotas servem index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API (FastAPI via uvicorn) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Não propagar cabeçalhos sensíveis do backend para o cliente
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Timeouts razoáveis
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # Limite de tamanho de request (evita upload excessivo)
        client_max_body_size 1m;
    }

    # ── Deny acesso a arquivos ocultos ────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
